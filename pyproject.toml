[project]
name = "code-intelligence"
version = "0.1.0"
description = "GitHub repository synchronization and local code-intelligence orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6.0,<2",
  "PyYAML>=6.0,<7",
]

[project.scripts]
code-intelligence = "code_intelligence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_intelligence"]
